name: data-model-tests
on: [push, pull_request]
jobs:
  proof-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python3 tools/run_all_tests.py data_model.yaml
